name: กันไม่ให้ Supabase พักโปรเจกต์

# แพ็กเกจฟรีของ Supabase จะพักโปรเจกต์ถ้าไม่มีการใช้งาน 7 วัน
# งานนี้เรียกฐานข้อมูลวันละครั้งเพื่อให้ระบบทำงานอยู่เสมอ (ฟรี ไม่อ่าน/แก้ข้อมูลใดๆ)

on:
  schedule:
    - cron: '17 1 * * *'   # ทุกวัน 08:17 น. เวลาไทย
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: เรียกฐานข้อมูล
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "ยังไม่ได้ตั้งค่า Supabase ใน js/config.js ข้าม"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/receipts?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then echo "เรียกไม่สำเร็จ โปรเจกต์อาจถูกพักแล้ว ให้กด Restore ที่ supabase.com"; exit 1; fi
